[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-vetting"
version = "0.4.1"
description = "CI-runable vetting of pull request authors from public GitHub signals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oli Treadwell" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[tool.setuptools]
packages = ["pr_vetting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pr_vetting --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
